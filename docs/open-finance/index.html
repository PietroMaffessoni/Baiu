<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Voltar para o Baiu</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0F1A3D;
    color: #F4F0E6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 360px; padding: 24px 16px; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: #B9C2DE; line-height: 1.5; margin: 0 0 24px; }
  a.button {
    display: block;
    padding: 16px;
    border-radius: 999px;
    background: #FFB648;
    color: #0F1A3D;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>Autorização enviada</h1>
  <p>Seu banco terminou a autorização do Open Finance. Volte para o Baiu para ver suas contas.</p>
  <a class="button" href="baiu://open-finance">Voltar para o Baiu</a>
</main>
<script>
  // Depois de autorizar no banco, a Celcoin e a Polp mandam a pessoa para cá; daqui o app abre sozinho.
  window.location.replace('baiu://open-finance');
</script>
</body>
</html>
